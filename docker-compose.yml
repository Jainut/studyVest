services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyvest
      POSTGRES_USER: studyvest
      POSTGRES_PASSWORD: studyvest
    ports:
      - "5432:5432"
    volumes:
      - studyvest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvest -d studyvest"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://studyvest:studyvest@db:5432/studyvest?schema=public
      JWT_SECRET: altere-esta-chave-antes-de-publicar-studyvest
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3333:3333"
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/server.js"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3333/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  studyvest_postgres:
